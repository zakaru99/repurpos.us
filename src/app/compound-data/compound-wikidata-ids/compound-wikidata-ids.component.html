<!-- Chemical properties (Wikidata when the compound has an item, else from the vendors) -->
<div class="block" *ngIf="(chemData.length > 0 && qid) || smiles || ikey?.length === 14">
  <h3 class="block-heading">
    Chemical properties
    <span class="count" *ngIf="chemData.length > 0 && qid">from <a [href]="'https://www.wikidata.org/entity/' + qid" target="_blank" rel="noreferrer">Wikidata</a></span>
  </h3>
  <table class="facts">
    <tbody>
      <tr *ngIf="formula && qid">
        <th scope="row">Formula</th>
        <td class="formula">{{ formula }}</td>
      </tr>
      <ng-container *ngIf="chemData.length > 0 && qid; else fromVendors">
        <tr *ngFor="let x of chemData">
          <th scope="row">{{ x['property'] | slice:0:1 | uppercase }}{{ x['property'] | slice:1 }}</th>
          <td class="mono"><span class="values"><span *ngFor="let z of x['values']">{{ z }}</span></span></td>
        </tr>
      </ng-container>
      <ng-template #fromVendors>
        <tr *ngIf="smiles">
          <th scope="row">SMILES</th>
          <td class="mono">{{ smiles }}</td>
        </tr>
        <tr *ngIf="ikey?.length === 14">
          <th scope="row">InChIKey (first block)</th>
          <td class="mono">{{ ikey }}</td>
        </tr>
      </ng-template>
      <tr *ngIf="chirality">
        <th scope="row">Chirality</th>
        <td>{{ chirality }}</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Identifiers in other databases -->
<div class="block" *ngIf="idData.length > 0 && qid">
  <h3 class="block-heading">External resources</h3>
  <table class="facts">
    <tbody>
      <tr>
        <th scope="row">Wikidata</th>
        <td class="mono"><a [href]="'https://www.wikidata.org/entity/' + qid" target="_blank" rel="noreferrer">{{ qid }}</a></td>
      </tr>
      <tr *ngFor="let obj of idData">
        <th scope="row">{{ obj['property'] }}</th>
        <td class="mono"><span class="values">
          <ng-container *ngFor="let id of obj['values']">
            <a *ngIf="obj['url']; else plainId" [href]="obj['url']" target="_blank" rel="noreferrer">{{ id }}</a>
            <ng-template #plainId><span>{{ id }}</span></ng-template>
          </ng-container>
        </span></td>
      </tr>
    </tbody>
  </table>
</div>
