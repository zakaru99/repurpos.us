<!-- Dose-response results: open by default, the first rows shown, the rest one click away -->
<div class="block" *ngIf="assayData.length > 0">
  <button type="button" class="disclosure" (click)="open = !open" [attr.aria-expanded]="open">
    <span class="chev"></span>
    <span class="d-title">Dose response</span>
    <span class="d-summary">{{ summary }}</span>
  </button>

  <div class="panel" *ngIf="open">
  <div class="scroll">
    <table class="results">
      <thead>
        <tr>
          <th *ngFor="let c of columns" [class.num]="c.num" [attr.aria-sort]="ariaSort(c.key)">
            <button type="button" class="sort" (click)="sortData(c.key)">{{ c.label }}<span class="arrow" *ngIf="sortColumn === c.key">{{ sortDirection === 'asc' ? '▲' : '▼' }}</span></button>
          </th>
          <th>Curve</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let x of shownRows">
          <td class="assay">
            <a [routerLink]="['/assays', x.assay_id]">
              <span class="title" [outerHTML]="(x.title_short || x.assay_title) | sciItalicize"></span>
            </a>
            <span class="id">{{ x.assay_id }}</span>
          </td>
          <td><span *ngIf="x.indication" [outerHTML]="x.indication | sciItalicize"></span></td>
          <td><span *ngIf="x.activity_type" [outerHTML]="x.activity_type.replace('50', '<sub>50</sub>')"></span></td>
          <td class="num" [class.toxic]="isToxic(x)" [title]="x.ac50 ? x.ac50.toExponential(2) + ' M' : ''">
            {{ x.ac_precision ? x.ac_precision + ' ' : '' }}{{ conc(x.ac50) }}
            <span class="tox-note" *ngIf="isToxic(x)">cytotoxic</span>
          </td>
          <td class="curve">
            <!-- One thumbnail per row; the rest of the row's curves are in the viewer -->
            <button type="button" class="curve-thumb-btn" *ngIf="x.curve_keys?.length" (click)="openCurves(x)"
                    [attr.aria-label]="(x.curve_keys.length > 1 ? 'View ' + x.curve_keys.length + ' dose response curves' : 'Enlarge dose response curve') + ' for ' + x.assay_id">
              <img class="curve-thumb" [src]="curveUrl(x.curve_keys[0])" loading="lazy" alt="">
              <span class="curve-more" *ngIf="x.curve_keys.length > 1">+{{ x.curve_keys.length - 1 }}</span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <button type="button" class="more" *ngIf="assayData.length > preview" (click)="showAll = !showAll">
    {{ showAll ? 'Show fewer' : 'Show all ' + assayData.length }}
  </button>
  </div>

  <!-- ENLARGED CURVE -->
  <div class="curve-overlay" *ngIf="viewer" (click)="closeCurve()" role="dialog" aria-modal="true"
       [attr.aria-label]="'Dose response curves for ' + viewer.assayId">
    <figure class="curve-viewer" (click)="$event.stopPropagation()">
      <img class="curve-full" [src]="curveUrl(viewer.keys[viewer.index])"
           [alt]="'Dose response curve ' + (viewer.index + 1) + ' of ' + viewer.keys.length + ' for ' + viewer.assayId">
      <figcaption class="curve-caption">
        <span class="curve-what">{{ viewer.title }} <span class="curve-id">{{ viewer.assayId }}</span></span>
        <span class="curve-nav" *ngIf="viewer.keys.length > 1">
          <button type="button" (click)="step(-1)" aria-label="Previous curve">‹</button>
          <span aria-live="polite">{{ viewer.index + 1 }} of {{ viewer.keys.length }}</span>
          <button type="button" (click)="step(1)" aria-label="Next curve">›</button>
        </span>
        <button type="button" class="curve-close" (click)="closeCurve()" aria-label="Close">×</button>
      </figcaption>
    </figure>
  </div>
</div>
