<!-- Dose-response results: open by default, the first rows shown, the rest one click away -->
<div class="block" *ngIf="assayData.length > 0">
  <button type="button" class="disclosure" (click)="open = !open" [attr.aria-expanded]="open">
    <span class="chev"></span>
    <span class="d-title">Dose response</span>
    <span class="d-summary">{{ summary }}</span>
  </button>

  <div class="panel" *ngIf="open">
  <div class="scroll">
    <table class="results">
      <thead>
        <tr>
          <th *ngFor="let c of columns" [class.num]="c.num" [attr.aria-sort]="ariaSort(c.key)">
            <button type="button" class="sort" (click)="sortData(c.key)">{{ c.label }}<span class="arrow" *ngIf="sortColumn === c.key">{{ sortDirection === 'asc' ? '▲' : '▼' }}</span></button>
          </th>
          <th>Curve</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let x of shownRows">
          <td class="assay">
            <a [routerLink]="['/assays', x.assay_id]">
              <span class="title" [outerHTML]="(x.title_short || x.assay_title) | sciItalicize"></span>
            </a>
            <span class="id">{{ x.assay_id }}</span>
          </td>
          <td><span *ngIf="x.indication" [outerHTML]="x.indication | sciItalicize"></span></td>
          <td><span *ngIf="x.activity_type" [outerHTML]="x.activity_type.replace('50', '<sub>50</sub>')"></span></td>
          <td class="num" [class.toxic]="isToxic(x)" [title]="x.ac50 ? x.ac50.toExponential(2) + ' M' : ''">
            {{ x.ac_precision ? x.ac_precision + ' ' : '' }}{{ conc(x.ac50) }}
            <span class="tox-note" *ngIf="isToxic(x)">cytotoxic</span>
          </td>
          <td class="curve">
            <button type="button" class="curve-thumb-btn" *ngFor="let key of x.curve_keys" (click)="openCurve(key)"
                    [attr.aria-label]="'Enlarge dose response curve for ' + x.assay_id">
              <img class="curve-thumb" [src]="curveUrl(key)" loading="lazy" alt="">
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <button type="button" class="more" *ngIf="assayData.length > preview" (click)="showAll = !showAll">
    {{ showAll ? 'Show fewer' : 'Show all ' + assayData.length }}
  </button>
  </div>

  <!-- ENLARGED CURVE -->
  <div class="curve-overlay" *ngIf="enlargedCurve" (click)="closeCurve()" role="dialog" aria-modal="true" aria-label="Dose response curve">
    <img class="curve-full" [src]="enlargedCurve" alt="Dose response curve" (click)="$event.stopPropagation()">
  </div>
</div>
