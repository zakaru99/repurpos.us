<!-- Band, section nav and Overview -->
<app-compound-header [results_per_page]="num_similar_per_page"></app-compound-header>

<!-- DEVELOPMENT AND PHARMACOLOGY: each licensed source's record for the drug
     (phase, mechanism, targets, PK), on a grey band below the screening data -->
<section id="development" class="band muted">
  <div class="inner">
    <h2>Development and pharmacology</h2>
    <ng-container *ngIf="loggedIn">
      <app-compound-vendor-data></app-compound-vendor-data>
      <app-compound-ontology-data></app-compound-ontology-data>
    </ng-container>
    <ng-container *ngIf="!loggedIn" [ngTemplateOutlet]="signIn"
                  [ngTemplateOutletContext]="{ what: 'Highest phase, mechanism, targets and PK from Clarivate Integrity, GVK GoStar and Citeline Pharmaprojects.', showAvail: true }"></ng-container>
  </div>
</section>

<div class="band">
  <div class="inner">
    <app-similar-compounds [results_per_page]="num_similar_per_page"></app-similar-compounds>
  </div>
</div>

<!-- Signed out: what signing in would show here, and what this compound has -->
<ng-template #signIn let-what="what" let-showAvail="showAvail">
  <div class="notice">
    <div>
      <p class="notice-title">Sign in to see this section</p>
      <p>{{ what }}</p>
      <p class="avail-data" *ngIf="showAvail && availableNames.length">Available for this compound: {{ availableNames.join(', ') }}.</p>
    </div>
    <button type="button" class="btn" (click)="signInPrompt()">Sign in</button>
  </div>
</ng-template>
