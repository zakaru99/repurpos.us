<!-- Everything else Wikidata says about the compound; each value searches REFRAMEdb -->
<div class="block" *ngIf="table_data.length > 0">
  <button type="button" class="disclosure" (click)="open = !open" [attr.aria-expanded]="open">
    <span class="chev"></span>
    <span class="d-title">More from Wikidata</span>
    <span class="d-summary">{{ summary }}</span>
  </button>

  <table class="facts" *ngIf="open">
    <tbody>
      <tr *ngFor="let x of table_data">
        <th scope="row">{{ x['property'] | slice:0:1 | uppercase }}{{ x['property'] | slice:1 }}</th>
        <td><span class="values">
          <a *ngFor="let z of x['values']" [routerLink]="['/search/']" [queryParams]="{ query: '&quot;' + z + '&quot;', type: 'string' }"
             [matTooltip]="'Search for ' + z">{{ z }}</a>
        </span></td>
      </tr>
    </tbody>
  </table>
</div>
