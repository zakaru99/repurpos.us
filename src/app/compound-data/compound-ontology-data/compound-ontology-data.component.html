<div class="block" *ngIf="rows.length > 0">
  <button type="button" class="disclosure" (click)="open = !open" [attr.aria-expanded]="open">
    <span class="chev"></span>
    <span class="d-title">Mechanism of action ontology</span>
    <span class="d-summary">{{ moaSummary }}</span>
  </button>
  <div class="scroll" *ngIf="open">
    <table class="results">
      <thead>
        <tr><th>Mechanism</th><th>Path</th><th>Category</th><th>Source</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of rows">
          <td class="moa"><a [href]="'/ontology-tree?src=' + r.src + '&search_id=' + r.node">{{ r.moa }}</a></td>
          <td class="path">{{ r.path }}</td>
          <td>{{ r.category }}</td>
          <td class="muted">{{ r.source }}</td>
        </tr>
      </tbody>
    </table>
    <p class="tree-link"><a href="/ontology-tree?src=0">Open the ontology tree</a></p>
  </div>
</div>
