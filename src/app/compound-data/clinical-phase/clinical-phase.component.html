<ol class="track" *ngIf="sel_phases.length" [class.stopped]="stopped" aria-label="Development stage">
  <li *ngFor="let p of sel_phases" class="step" [ngClass]="stepClass(p)" [matTooltip]="p.name | titlecase">
    <span class="bar"></span>
    <span class="lbl">{{ shortLabel(p) }}</span>
  </li>
</ol>
