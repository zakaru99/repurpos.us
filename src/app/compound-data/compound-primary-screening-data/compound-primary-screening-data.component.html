<!-- Single-concentration primary screens: whether the compound was picked as a hit -->
<div class="block" *ngIf="primaryData.length > 0">
  <button type="button" class="disclosure" (click)="open = !open" [attr.aria-expanded]="open">
    <span class="chev"></span>
    <span class="d-title">Primary screens</span>
    <span class="d-summary">{{ hitCount }} {{ hitCount === 1 ? 'hit' : 'hits' }} in {{ primaryData.length }} single-concentration {{ primaryData.length === 1 ? 'screen' : 'screens' }}</span>
  </button>

  <div class="panel" *ngIf="open">
  <div class="head" *ngIf="hitCount && hitCount < primaryData.length">
    <div class="seg" role="group" aria-label="Show">
      <button type="button" [class.active]="!hitsOnly" [attr.aria-pressed]="!hitsOnly" (click)="hitsOnly = false">All screens</button>
      <button type="button" [class.active]="hitsOnly" [attr.aria-pressed]="hitsOnly" (click)="hitsOnly = true">Hits only</button>
    </div>
  </div>

  <div class="scroll">
    <table class="results">
      <thead>
        <tr>
          <th *ngFor="let c of columns" [attr.aria-sort]="ariaSort(c.key)">
            <button type="button" class="sort" (click)="sortData(c.key)">{{ c.label }}<span class="arrow" *ngIf="sortColumn === c.key">{{ sortDirection === 'asc' ? '▲' : '▼' }}</span></button>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let x of shownRows">
          <td class="assay">
            <a [routerLink]="['/assays', x.assay_id]">
              <span [outerHTML]="(x.title_short || x.assay_title) | sciItalicize"></span>
            </a>
            <span class="id">{{ x.assay_id }}</span>
          </td>
          <td><span *ngIf="x.indication" [outerHTML]="x.indication | sciItalicize"></span></td>
          <td [class.hit]="x.hit">{{ x.hit ? 'Hit' : 'Not a hit' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  </div>
</div>
