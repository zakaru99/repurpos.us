<div class="tools">
  <nav class="filters" aria-label="Filter by status">
    <button *ngFor="let f of filters" type="button"
            [class.active]="selectedStatus === f.value" [attr.aria-pressed]="selectedStatus === f.value"
            (click)="filterByStatus(f.value)">{{ f.label }} <span class="n">{{ count(f.value) }}</span></button>
  </nav>
  <input type="search" class="search" [(ngModel)]="query" name="q" autocomplete="off"
         placeholder="Search proposals" aria-label="Search proposals">
</div>

<p class="error" *ngIf="errorMessage" role="alert">
  {{ errorMessage }} <button type="button" class="retry" (click)="fetchProposals()">Try again</button>
</p>
<p class="muted" *ngIf="isLoading">Loading…</p>

<div class="layout" [class.open]="selected" *ngIf="!isLoading && !errorMessage">
  <div class="list">
    <app-proposal-table [proposals]="filteredProposals" [selectedId]="selectedId" [compact]="!!selected"
                        (pick)="select($event)"></app-proposal-table>
    <p class="muted empty" *ngIf="!filteredProposals.length">
      {{ proposals.length ? 'No proposals match.' : 'No proposals yet.' }}
    </p>
  </div>

  <!-- Only present once a proposal is picked; the table has the full width otherwise -->
  <section class="detail" *ngIf="selected">
    <app-proposal-detail [proposal]="selected"
                         (statusChanged)="onStatusChanged($event)" (closed)="clearSelection()"></app-proposal-detail>
  </section>
</div>
