<div class="split" [class.has-selection]="selected">

  <!-- List -->
  <section class="list-pane" aria-label="Proposals">
    <div class="list-tools">
      <div class="segmented" role="tablist" aria-label="Filter by status">
        <button *ngFor="let f of filters" type="button" role="tab"
                [class.active]="selectedStatus === f.value" [attr.aria-selected]="selectedStatus === f.value"
                (click)="filterByStatus(f.value)">
          {{ f.label }} <span class="seg-count">{{ count(f.value) }}</span>
        </button>
      </div>
      <input type="search" class="search" [(ngModel)]="query" name="q" autocomplete="off"
             placeholder="Search indication, submitter, institution" aria-label="Search proposals">
    </div>

    <div class="notice error" *ngIf="errorMessage" role="alert">
      {{ errorMessage }} <button type="button" class="link" (click)="fetchProposals()">Retry</button>
    </div>

    <ul class="list" *ngIf="!isLoading; else loading">
      <li *ngFor="let p of filteredProposals">
        <button type="button" class="prow" [class.selected]="p.id === selectedId" (click)="select(p)">
          <span class="row-top">
            <span class="row-title">{{ p.indication || 'Untitled proposal' }}</span>
            <span class="status-tag" [ngClass]="p.status | lowercase">{{ p.status }}</span>
          </span>
          <span class="row-sub">{{ p.submittedBy || 'Unknown' }}<ng-container *ngIf="p.institution"> · {{ p.institution }}</ng-container></span>
          <span class="row-meta">#{{ p.id }} · {{ (p.submittedOn | date:'d MMM y') || 'no date' }}</span>
        </button>
      </li>
      <li class="empty" *ngIf="!filteredProposals.length && !errorMessage">
        {{ proposals.length ? 'No proposals match.' : 'No proposals yet.' }}
      </li>
    </ul>

    <ng-template #loading>
      <div class="empty">Loading proposals…</div>
    </ng-template>
  </section>

  <!-- Detail -->
  <section class="detail-pane">
    <app-proposal-detail *ngIf="selected; else nothingSelected" [proposal]="selected"
                         (statusChanged)="onStatusChanged($event)" (closed)="clearSelection()"></app-proposal-detail>
    <ng-template #nothingSelected>
      <div class="placeholder">
        <p>Select a proposal to review it.</p>
        <p class="hint" *ngIf="count('Pending')">{{ count('Pending') }} waiting for a decision.</p>
      </div>
    </ng-template>
  </section>
</div>
