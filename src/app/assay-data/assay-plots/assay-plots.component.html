<!-- Dose-response chart: activity switch, the dot plot, then pages.
     The assay page shows this only to signed-in users. -->
<p class="muted" *ngIf="state === 'loading'">Loading results…</p>
<p class="error" *ngIf="state === 'error'" role="alert">Could not load the results for this assay. Try reloading the page.</p>

<ng-container *ngIf="state === 'done'">
  <ng-container *ngIf="hasDoseResponseData; else noData">
    <div class="chart-head">
      <app-assay-type-btn></app-assay-type-btn>
      <app-assay-pagination></app-assay-pagination>
    </div>
    <app-dot-plot></app-dot-plot>
  </ng-container>
</ng-container>

<ng-template #noData>
  <div class="empty" role="status">
    <p class="empty-title">No screening results yet</p>
    <p>Dose-response results for this assay haven't been published.</p>
  </div>
</ng-template>
