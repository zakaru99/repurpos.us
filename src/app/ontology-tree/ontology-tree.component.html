<!-- Toolbar: title, ontology switch, search, view toggle - one slim row -->
<div class="toolbar">
  <h1>Ontology</h1>

  <div class="segmented sources" role="tablist" aria-label="Ontology">
    <button *ngFor="let o of ontologies; let i = index" type="button" role="tab"
            [class.active]="src == i" [attr.aria-selected]="src == i"
            (click)="switch_ontology_source({ target: { name: i } })">{{ o.label }}</button>
  </div>

  <form class="search" (submit)="$event.preventDefault()" role="search">
    <mat-icon class="search-icon" aria-hidden="true">search</mat-icon>
    <input #searchInput type="search" autocomplete="off" aria-label="Search this ontology"
           placeholder="Search mechanisms, drugs, InChIKeys"
           [formControl]="myControl" [matAutocomplete]="auto">
    <mat-autocomplete #auto="matAutocomplete" [displayWith]="getTitle.bind(this)" [panelWidth]="420"
                      (optionSelected)="onSearchSelected($event.option.value)">
      <mat-option *ngFor="let option of filteredOptions | async" [value]="option.id">
        <span class="opt-name">{{ option.preferred_name }}</span>
        <span class="opt-parent">{{ option.parent_name }}</span>
      </mat-option>
    </mat-autocomplete>
  </form>

  <div class="segmented view" role="tablist" aria-label="View">
    <button type="button" role="tab" [class.active]="view === 'columns'" [attr.aria-selected]="view === 'columns'"
            (click)="setView('columns')">Columns</button>
    <button type="button" role="tab" [class.active]="view === 'tree'" [attr.aria-selected]="view === 'tree'"
            (click)="setView('tree')">Tree</button>
  </div>
</div>

<div class="stage">
  <app-ontology-columns *ngIf="view === 'columns' && currentRoot"
                        [root]="currentRoot" [revealId]="revealId"></app-ontology-columns>

  <div class="tree-view" [hidden]="view !== 'tree'">
    <div class="d3-chart tree" #chart></div>

    <div class="legend" aria-label="Legend">
      <span class="key"><span class="dot category"></span>Category</span>
      <span class="key"><span class="dot moa"></span>Has compounds</span>
      <span class="key"><span class="dot compound"></span>Compound</span>
      <span class="key"><span class="dot found"></span>Search path</span>
    </div>
    <p class="hint">Drag to pan · Scroll to zoom · Right-click a green node to export its compounds</p>
  </div>
</div>
