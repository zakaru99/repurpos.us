<div class="page">
  <div class="column" [ngSwitch]="state" aria-live="polite">

    <ng-container *ngSwitchCase="'checking'">
      <h1>Checking your link…</h1>
    </ng-container>

    <!-- Link is good: choose the new password -->
    <ng-container *ngSwitchCase="'ready'">
      <h1>Choose a new password</h1>
      <p class="text">Use at least 8 characters.</p>

      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" novalidate>
        <label class="field" [class.invalid]="showErr('password')">
          <span class="field-label">New password</span>
          <input type="password" formControlName="password" id="resetPassword" name="resetPassword" autocomplete="new-password">
          <span class="field-error" *ngIf="showErr('password')">Use at least 8 characters.</span>
        </label>
        <label class="field" [class.invalid]="showErr('confirmPassword')">
          <span class="field-label">Confirm new password</span>
          <input type="password" formControlName="confirmPassword" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
          <span class="field-error" *ngIf="showErr('confirmPassword')">Passwords don't match.</span>
        </label>
        <button type="submit" class="btn" [disabled]="sending">{{ sending ? 'Saving…' : 'Save new password' }}</button>
        <p class="field-error" *ngIf="saveError" role="alert">{{ saveError }}</p>
      </form>
    </ng-container>

    <ng-container *ngSwitchCase="'done'">
      <h1>Your password has been changed</h1>
      <p class="text">Sign in with your new password.</p>
      <button type="button" class="btn" (click)="signIn()">Sign in</button>
    </ng-container>

    <!-- Invalid or expired: ask for another link from the sign-in box -->
    <ng-container *ngSwitchCase="'invalid'">
      <h1>This reset link no longer works</h1>
      <p class="text">Reset links work once and expire after a while. Ask for a new one, then use the most recent email.</p>
      <button type="button" class="btn" (click)="requestNewLink()">Ask for a new link</button>
    </ng-container>

  </div>
</div>
