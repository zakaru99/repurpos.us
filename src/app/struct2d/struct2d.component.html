<!-- Shared by REFRAMEdb and CRESTdb; keep the two copies identical -->
<div (deferLoad)="showMyElement=true">
  <div class="svg-wrapper group" *ngIf="showMyElement" [innerHTML]="svg" role="img" [attr.aria-label]="label"></div>
</div>

<div class="struct-actions" *ngIf="launch_search || (downloadable && raw)">
  <button *ngIf="downloadable && raw" type="button" class="struct-download" (click)="download()">Download structure (SVG)</button>
  <button *ngIf="launch_search" type="button" class="struct-search"
          [routerLink]="['/search/']" [queryParams]="{ query: smiles, type: 'structure' }">Search this structure</button>
</div>
