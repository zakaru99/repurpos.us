<!-- Site-wide notice of an upcoming maintenance window (set in the admin portal) -->
<div *ngIf="visible" class="banner" role="status">
  <div class="inner">
    <p class="text">
      <span class="label">Scheduled maintenance, {{ whenText }}.</span>
      {{ displayText }}
      <span class="posted" *ngIf="postedText">{{ postedText }}</span>
    </p>
    <button type="button" class="dismiss" aria-label="Dismiss maintenance notice" (click)="dismiss()">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
</div>
