<form
  class="search"
  method="post"
  [ngClass]="{ 'expanded': inputFocused }"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
  action=""
>
  <label for="search-box-add" (click)="focusInput(inputEl)">
    <mat-icon>search</mat-icon>
  </label>

  <div class="input-toggle-wrapper">
    <input
      #inputEl
      id="search-box-add"
      type="text"
      class="quick-search"
      name="quick_search"
      aria-label="quick search"
      autocomplete="off"
      [placeholder]="getPlaceholder()"
      [(ngModel)]="query"
      (keydown.enter)="onEnter()"
      (keyup)="onKeyUp($event)"
    />

    <!-- Dropdown panel: scope toggle + suggestions, shown only while focused -->
    <div *ngIf="inputFocused" class="qs-panel">
      <div class="search-toggle" role="tablist">
        <div
          class="toggle-option"
          role="tab"
          [class.active]="selected === 'compound'"
          tabindex="0"
          (click)="select('compound')">
          Compounds
        </div>
        <div
          class="toggle-option"
          role="tab"
          [class.active]="selected === 'assay'"
          tabindex="0"
          (click)="select('assay')">
          Assays
        </div>
      </div>

      <ul class="suggestions-dropdown" *ngIf="suggestions.length > 0">
        <li
          *ngFor="let suggestion of suggestions"
          (mousedown)="onSuggestionClick(suggestion.value)"
        >
          {{ suggestion.value }}
        </li>
      </ul>
    </div>
  </div>
</form>
