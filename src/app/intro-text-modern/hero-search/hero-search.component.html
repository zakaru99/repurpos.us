<div class="search-tabs" role="tablist" aria-label="Search for">
  <button type="button" role="tab" class="tab"
          [class.active]="searchCategory === 'compound'"
          [attr.aria-selected]="searchCategory === 'compound'"
          (click)="setSearchCategory('compound')">Compounds</button>
  <button type="button" role="tab" class="tab"
          [class.active]="searchCategory === 'assay'"
          [attr.aria-selected]="searchCategory === 'assay'"
          (click)="setSearchCategory('assay')">Assays</button>
</div>

<div class="search-bar-wrapper" [class.dropdown-open]="dropdownVisible">
  <div class="input-container">
    <input type="text" [(ngModel)]="query"
           (keydown)="onKeyDown($event)"
           (ngModelChange)="onQueryChange($event)"
           [attr.aria-label]="searchCategory === 'compound' ? 'Search compounds' : 'Search assays'"
           [placeholder]="searchCategory === 'compound' ? 'Drug name, synonym or identifier' : 'Assay name, organism or keyword'" />
    <ul class="predictive-dropdown" *ngIf="dropdownVisible">
      <li *ngFor="let item of suggestions; let i = index"
          [class.highlighted]="i === highlightedIndex"
          (mouseenter)="setHighlight(i)"
          (click)="selectSuggestion(item.value)"
          class="suggestion-item">

        <span class="suggestion-value">
          {{ item.value }}
        </span>

        <span class="suggestion-pill">
          {{ item.type }}
        </span>
      </li>
    </ul>
  </div>
  <button type="button" class="submit" (click)="search()">Search</button>
</div>
