<header class="site-header" [class.nav-open]="expanded" [class.login-open]="loginBox">
  <div class="bar">

    <button class="nav-toggle" type="button" (click)="toggleNav()"
            [attr.aria-expanded]="expanded" aria-controls="primary-nav" aria-label="Toggle navigation">
      <span class="nav-toggle-lines"></span>
    </button>

    <a href="/" class="brand">
      <img src="../assets/logo-app-sm.png" width="28" height="28" alt="">
      <span class="wordmark"><span class="bold">reframe</span><span class="thin">db</span></span>
      <span class="tagline">Open &amp; extendable drug repurposing data</span>
    </a>

    <div class="nav-body" id="primary-nav">
      <div class="search">
        <app-quick-search></app-quick-search>
      </div>

      <ul class="nav-links">
        <li><a routerLink="/assays" routerLinkActive="active" (click)="collapseNav()">Assays</a></li>
        <li><a routerLink="/ontology-tree" routerLinkActive="active" [queryParams]="{src: '0'}" (click)="collapseNav()">Ontology tree</a></li>
        <li><a routerLink="/workflow" routerLinkActive="active" (click)="collapseNav()">Workflow</a></li>
        <li><a routerLink="/about" routerLinkActive="active" (click)="collapseNav()">About</a></li>
        <li><a routerLink="/contact-us" routerLinkActive="active" (click)="collapseNav()">Contact</a></li>
        <li *ngIf="loggedIn"><a routerLink="/user_portal" routerLinkActive="active" (click)="collapseNav()">User portal</a></li>
        <li *ngIf="isAdmin"><a routerLink="/internal/proposals" routerLinkActive="active" (click)="collapseNav()">Calibr admins</a></li>
      </ul>

      <div class="nav-actions">
        <a *ngIf="!loggedIn" class="sign-in" (click)="showLogin()" (click)="clickedInside($event)">Sign in</a>

        <div class="reveal user-login" [ngClass]="{'open': loginBox, 'logout': loggedIn}">
          <div class="login-sheet" (click)="clickedInside($event)">
            <div class="sheet-header">
              <button class="sheet-close" (click)="showLogin()" aria-label="Close">&#x2715;</button>
            </div>
            <app-user-login></app-user-login>
          </div>
        </div>
      </div>
    </div>

  </div>
</header>
