<div class="bar" [class.dropdown-open]="dropdownVisible">
  <div class="input-container">
    <input #searchInput type="text" [(ngModel)]="searchQuery" autofocus autocomplete="off"
           placeholder="Drug name, synonym, InChIKey, class, target or disease"
           aria-label="Search compounds"
           (keydown)="onKeyDown($event)"
           (ngModelChange)="onQueryChange($event)">

    <ul class="predictive-dropdown" *ngIf="dropdownVisible">
      <li *ngFor="let item of suggestions; let i = index"
          [class.highlighted]="i === highlightedIndex"
          (mouseenter)="setHighlight(i)"
          (click)="selectSuggestion(item.value)">
        <span class="suggestion-value">{{ item.value }}</span>
        <span class="suggestion-type">{{ item.type }}</span>
      </li>
    </ul>
  </div>
  <button type="button" class="submit" (click)="onSubmit()">Search</button>
</div>

<!-- One line of examples, one per kind of search -->
<p class="examples">
  <span class="ex-label">Try</span>
  <ng-container *ngFor="let example of examples; let last = last">
    <a [routerLink]="['/search']" [queryParams]="{ query: example.query, type: example.type }"
       [title]="example.label">{{ example.description }}</a><span class="sep" *ngIf="!last" aria-hidden="true">·</span>
  </ng-container>
</p>
