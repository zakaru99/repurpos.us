<!-- Compounds by name / identifier, or by drawn structure -->
<div class="tabs" role="tablist" aria-label="Search by">
  <button type="button" role="tab" [class.active]="selectedTab === textSearch_tabIdx"
          [attr.aria-selected]="selectedTab === textSearch_tabIdx" (click)="selectTab(textSearch_tabIdx)">Name or identifier</button>
  <button type="button" role="tab" [class.active]="selectedTab === structSearch_tabIdx"
          [attr.aria-selected]="selectedTab === structSearch_tabIdx" (click)="selectTab(structSearch_tabIdx)">Structure</button>
</div>

<app-text-search *ngIf="selectedTab === textSearch_tabIdx" [searchQuery]="searchQuery"></app-text-search>

<!-- The structure editor needs a light surface. Kept mounted (hidden) so it
     hears the structure the page announces from the URL on load. -->
<div class="structure-panel" [hidden]="selectedTab !== structSearch_tabIdx">
  <app-structure-search></app-structure-search>
</div>
