<!-- Options and SMILES field, then the drawing editor. After a search on a
     shorter screen the editor folds away so the results are in view. -->
<app-structure-search-options></app-structure-search-options>

<button type="button" class="toggle" *ngIf="pressed" (click)="panelOpenState = !panelOpenState"
        [attr.aria-expanded]="panelOpenState">{{ panelOpenState ? 'Hide the editor' : 'Draw or edit the structure' }}</button>

<div [hidden]="!panelOpenState">
  <app-ketcher></app-ketcher>
</div>
