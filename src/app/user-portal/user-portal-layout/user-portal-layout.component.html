<header class="band">
  <div class="inner">
    <p class="portal-name"><span class="eyebrow">REFRAMEdb</span> Your account</p>

    <nav class="tabs" aria-label="Account sections">
      <a routerLink="my_assays" routerLinkActive="active">Proposals</a>
      <a routerLink="my_favorites" routerLinkActive="active">Favorites</a>
      <a routerLink="my_lists" routerLinkActive="active">Lists</a>
      <a routerLink="my_account" routerLinkActive="active">Account</a>
    </nav>

    <span class="who" *ngIf="email">{{ email }}</span>
  </div>
</header>

<main class="content">
  <router-outlet *ngIf="loggedIn; else signedOut"></router-outlet>
  <ng-template #signedOut>
    <p class="signed-out">Sign in to see your proposals, favorites and lists.</p>
  </ng-template>
</main>
